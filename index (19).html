<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Costa Sur</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0e1424;--coral:#ff6a4d;--teal:#19b5a5;--sand:#f1d9a8}
html,body{margin:0;height:100%;background:var(--navy);overflow:hidden;color:var(--sand);font:500 18px 'Barlow Condensed',system-ui,sans-serif}
canvas{display:block}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,#0e1424cc 100%)}
.h{position:fixed;pointer-events:none;z-index:2}
#money{top:14px;right:22px;font:36px Anton,Impact,sans-serif;text-shadow:0 2px 0 #0008}
#stars{top:62px;right:22px;font-size:26px;letter-spacing:5px;color:#f1d9a833}
#stars b{color:var(--coral);font-weight:400}
#mis{top:14px;left:50%;transform:translateX(-50%);background:#0e1424cc;border:2px solid var(--sand);border-radius:30px;padding:4px 18px;white-space:nowrap}

#bars b{display:block;height:100%}
#hp{background:var(--teal)}#cb{background:var(--coral)}
#spd{bottom:52px;left:50%;transform:translateX(-50%);font:28px Anton,Impact,sans-serif}
#mm{position:fixed;left:20px;bottom:20px;border-radius:50%;border:3px solid var(--sand);box-shadow:0 0 0 4px #0e1424;z-index:2}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font:110px Anton,Impact,sans-serif;color:var(--coral);opacity:0;transition:opacity .4s;pointer-events:none;z-index:3;text-shadow:6px 6px 0 #0e1424}
#menu{position:fixed;inset:0;z-index:5;background:#0e1424d9;backdrop-filter:blur(4px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
#menu h1{margin:0;font:clamp(56px,13vw,150px)/.9 Anton,Impact,sans-serif;color:var(--coral);text-shadow:6px 6px 0 var(--teal)}
#menu p{margin:14px 0 0;max-width:520px;line-height:1.35}

#menu li{margin:3px 0}
#menu button{font:28px Anton,Impact,sans-serif;letter-spacing:2px;background:var(--coral);color:var(--navy);border:0;padding:12px 44px;cursor:pointer;margin-top:6px}
#menu button:hover,#menu button:focus-visible{background:var(--sand);outline:3px solid var(--teal)}
</style></head><body>
<canvas id="c"></canvas>
<div class="h" id="mis"></div><div class="h" id="money"></div><div class="h" id="stars"></div><div class="h" id="toast"></div>
<div class="h" id="spd"></div><div class="h" id="bars"><i><b id="hp"></b></i><i><b id="cb"></b></i></div>
<canvas id="mm" width="160" height="160"></canvas><div id="ov"></div>
<div id="menu"><h1>COSTA SUR</h1>
<p>Una ciudad, un coche robado y un trabajo: haz entregas, gana dinero y despista a la policía.</p>
<ul><li>WASD / flechas: caminar y conducir</li><li>Shift: correr · Espacio: freno de mano</li><li>E: subir o bajar de un coche (también sirve para robarlo)</li><li>Ratón + clic (o F): disparar a pie</li></ul>
<button id="go">JUGAR</button></div>
<script>
const $=id=>document.getElementById(id),cv=$('c'),ctx=cv.getContext('2d'),mm=$('mm').getContext('2d');
let VW,VH;const rs=()=>{cv.width=VW=innerWidth;cv.height=VH=innerHeight};rs();addEventListener('resize',rs);
const S=240,R=80,N=12,W=S*N,D=Math.hypot,rnd=(a,b)=>a+Math.random()*(b-a),ri=n=>Math.random()*n|0,cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const angd=(a,b)=>{let d=b-a;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d};
const nodeP=(i,j)=>[i*S+R/2,j*S+R/2];
// ---- mundo ----
const B=[],pal=['#5b6478','#7a5c6e','#4d6b7a','#8a7355','#6a6f86','#7d4f4f','#52707a'];
for(let i=0;i<N;i++)for(let j=0;j<N;j++)B.push({x:i*S+R,y:j*S+R,w:S-R,h:S-R,park:Math.random()<.14,c:pal[ri(7)]});
const map=document.createElement('canvas');map.width=map.height=W;
{const m=map.getContext('2d');m.fillStyle='#2b2e37';m.fillRect(0,0,W,W);
m.strokeStyle='#f1d9a8';m.lineWidth=3;m.setLineDash([22,18]);
for(let i=0;i<N;i++){const p=i*S+R/2;m.beginPath();m.moveTo(p,0);m.lineTo(p,W);m.moveTo(0,p);m.lineTo(W,p);m.stroke()}
m.setLineDash([]);m.fillStyle='#2b2e37';
for(let i=0;i<N;i++)for(let j=0;j<N;j++)m.fillRect(i*S,j*S,R,R);
for(const b of B){m.fillStyle='#555966';m.fillRect(b.x-6,b.y-6,b.w+12,b.h+12);
if(b.park){m.fillStyle='#2f6b4a';m.fillRect(b.x,b.y,b.w,b.h);for(let t=0;t<9;t++){m.fillStyle=t%2?'#245a3d':'#2b6e48';m.beginPath();m.arc(b.x+rnd(15,b.w-15),b.y+rnd(15,b.h-15),rnd(9,17),0,7);m.fill()}}
else{m.fillStyle='#0006';m.fillRect(b.x+10,b.y+10,b.w,b.h);m.fillStyle=b.c;m.fillRect(b.x,b.y,b.w,b.h);m.fillStyle='#ffffff14';m.fillRect(b.x+14,b.y+14,b.w-28,b.h-28);
for(let t=0;t<3;t++){m.fillStyle='#0003';m.fillRect(b.x+rnd(20,b.w-50),b.y+rnd(20,b.h-50),rnd(16,30),rnd(14,24))}}}}
function solid(x,y,r,foot){if(x<r||y<r||x>W-r||y>W-r)return 1;const i=x/S|0,j=y/S|0;
for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){const p=i+a,q=j+b;if(p<0||q<0||p>=N||q>=N)continue;const k=B[p*N+q];if(foot&&k.park)continue;
if(D(x-cl(x,k.x,k.x+k.w),y-cl(y,k.y,k.y+k.h))<r)return 1}return 0}
function clear(x1,y1,x2,y2){for(let t=1;t<8;t++)if(solid(x1+(x2-x1)*t/8,y1+(y2-y1)*t/8,12,0))return 0;return 1}
// ---- estado ----
const G={on:0,money:0,heat:0,dead:0,sp:0,mt:2},P={x:0,y:0,a:0,hp:100,car:null,fc:0},k={},mouse={x:0,y:0,d:0};
let cars=[],peds=[],bul=[],fx=[],M=null,Z=1,cam={x:0,y:0};
const stars=()=>G.heat>.01?Math.min(5,1+(G.heat/1.5|0)):0;
let au;function snd(f,d,t='square',v=.04){try{au=au||new AudioContext();const o=au.createOscillator(),g=au.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(1e-4,au.currentTime+d);o.connect(g);g.connect(au.destination);o.start();o.stop(au.currentTime+d)}catch(e){}}
function toast(s){const e=$('toast');e.textContent=s;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,2600)}
function pick(c,g){const o=[[1,0],[-1,0],[0,1],[0,-1]].filter(d=>{const a=c.ti+d[0],b=c.tj+d[1];return a>=0&&b>=0&&a<N&&b<N&&!(a==c.pi&&b==c.pj)});
let d=o[ri(o.length)];if(g){const t=P.car||P;d=o.map(e=>{const n=nodeP(c.ti+e[0],c.tj+e[1]);return[e,D(n[0]-t.x,n[1]-t.y)]}).sort((u,v)=>u[1]-v[1])[0][0]}
c.pi=c.ti;c.pj=c.tj;c.ti+=d[0];c.tj+=d[1];c.dx=d[0];c.dy=d[1]}
function nearest(c){c.ti=cl(Math.round((c.x-R/2)/S),0,N-1);c.tj=cl(Math.round((c.y-R/2)/S),0,N-1);c.pi=c.pj=-9;c.dx=c.dy=0}
function mkCar(i,j,cop){const[x,y]=nodeP(i,j),c={x,y,a:0,v:0,hp:100,cop,ai:1,ti:i,tj:j,pi:-9,pj:-9,dx:0,dy:0,ct:0,m:0,rv:0,sg:1,stk:0,sc:0,
col:cop?'#ececec':['#e8553d','#19b5a5','#f1d9a8','#6f7bd9','#d9d9d9','#c9a227'][ri(6)]};pick(c);c.a=Math.atan2(c.dy,c.dx);cars.push(c);return c}
function spawnPlayer(){const[x,y]=nodeP(3,3);P.x=x-30;P.y=y;P.hp=100;P.car=null}
function newM(){const f=(x,y)=>{let p;do{p=nodeP(ri(N),ri(N))}while(D(p[0]-x,p[1]-y)<650);return p},p=f(P.x,P.y);M={s:0,x:p[0],y:p[1],t:0,txt:'Recoge el paquete'}}
function init(){spawnPlayer();const[x,y]=nodeP(3,3),c=mkCar(3,3);c.x=x+30;c.y=y;c.a=0;c.ai=0;for(let i=0;i<24;i++)mkCar(ri(N),ri(N));cam.x=P.x;cam.y=P.y}
// ---- física ----
function hurt(t,d){if(t.dead)return;t.hp-=d;if(t===P){if(P.hp<=0)die();return}if(t===P.car){P.hp-=d*.12;if(P.hp<=0)die()}if(t.hp<=0)boom(t)}
function boom(c){c.dead=1;fx.push({k:'b',x:c.x,y:c.y,t:.6,m:.6,r:70});snd(70,.4,'sawtooth',.1);if(c.cop)G.heat+=1.2;
for(const p of peds)if(D(p.x-c.x,p.y-c.y)<80)killPed(p,1);
if(c===P.car){P.car=null;P.x=c.x+22;P.y=c.y;P.hp-=45;if(P.hp<=0)die()}}
function carStep(c,dt,thr,str,hb){const mx=c.cop?470:440;c.v+=thr*(thr*c.v<0?520:300)*dt;c.v=cl(c.v,-150,mx);c.v*=1-(thr?.15:.6)*dt;if(hb)c.v*=1-2.5*dt;
c.a+=str*cl(c.v/140,-1,1)*2.6*dt;const nx=c.x+Math.cos(c.a)*c.v*dt,ny=c.y+Math.sin(c.a)*c.v*dt;
if(!solid(nx,ny,16,0)){c.x=nx;c.y=ny}else{if(!solid(nx,c.y,16,0))c.x=nx;else if(!solid(c.x,ny,16,0))c.y=ny;const s=Math.abs(c.v);if(s>140)hurt(c,(s-120)*.05);c.v*=.6;c.hit=1}}
function steer(c,dt,tx,ty,mx){const d=angd(c.a,Math.atan2(ty-c.y,tx-c.x)),sp=Math.abs(d)>1?.35:1;carStep(c,dt,c.v>mx*sp?-.3:1,cl(d*2.5,-1,1),0)}
function civAI(c,dt){const[nx,ny]=nodeP(c.ti,c.tj),tx=nx-c.dy*18,ty=ny+c.dx*18;if(D(tx-c.x,ty-c.y)<30)pick(c);steer(c,dt,tx,ty,c.cop?160:230)}
function copAI(c,dt){if(!stars()){if(c.m!=1){nearest(c);c.m=1}civAI(c,dt);return}
const T=P.car||P,cr=clear(c.x,c.y,T.x,T.y),d=D(T.x-c.x,T.y-c.y);
if(c.rv>0){c.rv-=dt;carStep(c,dt,-1,-c.sg,0);return}
if(cr){c.m=2;if(d<50&&!P.car)carStep(c,dt,0,0,1);else steer(c,dt,T.x,T.y,d<150?200:460)}
else{if(c.m!=3){nearest(c);c.m=3}const[nx,ny]=nodeP(c.ti,c.tj);if(D(nx-c.x,ny-c.y)<35)pick(c,1);steer(c,dt,nx,ny,330)}
c.stk=c.hit?c.stk+dt:Math.max(0,c.stk-dt);if(c.stk>.6){c.rv=1;c.stk=0;c.sg=Math.random()<.5?1:-1}
if(stars()>=3){c.sc-=dt;if(c.sc<=0&&d<320&&cr){c.sc=.7;shoot(c.x,c.y,Math.atan2(T.y-c.y,T.x-c.x)+rnd(-.12,.12),0)}}}
function shoot(x,y,a,own){bul.push({x:x+Math.cos(a)*12,y:y+Math.sin(a)*12,vx:Math.cos(a)*900,vy:Math.sin(a)*900,t:.7,own});snd(own?220:150,.06);
if(own)for(const p of peds){const d=D(p.x-x,p.y-y);if(d<350){p.f=3;p.a=Math.atan2(p.y-y,p.x-x)}}}
function killPed(p,crime){if(p.dead)return;p.dead=1;const v=10+ri(50);G.money+=v;if(crime)G.heat+=1.1;snd(120,.12,'triangle',.06);
fx.push({k:'b',x:p.x,y:p.y,t:.25,m:.25,r:16},{k:'t',x:p.x,y:p.y,t:1,m:1,txt:'+$'+v})}
function die(m){if(G.dead>0)return;G.dead=3;$('ov').textContent=m||'ABATIDO';$('ov').style.opacity=1;if(P.car){P.car.ai=0;P.car=null}G.money=Math.max(0,G.money-(m?200:100))}
function respawn(){$('ov').style.opacity=0;spawnPlayer();G.heat=0;cars=cars.filter(c=>!c.cop);bul=[]}
function useCar(){if(G.dead>0)return;if(P.car){const c=P.car;if(Math.abs(c.v)>200)return toast('Frena para bajar');
for(const s of[1,-1]){const x=c.x+Math.cos(c.a+s*1.57)*30,y=c.y+Math.sin(c.a+s*1.57)*30;if(!solid(x,y,8,1)){P.x=x;P.y=y;P.car=null;c.ai=0;return}}}
else{let b=null,bd=60;for(const c of cars){const d=D(c.x-P.x,c.y-P.y);if(!c.cop&&d<bd){b=c;bd=d}}if(b){if(b.ai){G.heat+=.6;toast('¡Coche robado!')}b.ai=0;P.car=b}}}
function spawn(){const t=P.car||P,far=(x,y,a,b)=>{const d=D(x-t.x,y-t.y);return d>a&&d<b};
if(peds.length<45){const v=Math.random()<.5,i=ri(N),u=i*S+rnd(4,R-4),w=rnd(0,W),x=v?u:w,y=v?w:u;if(far(x,y,450,900)&&!solid(x,y,6,1))peds.push({x,y,a:rnd(0,6.28),t:rnd(1,3),s:rnd(25,45),f:0,c:['#ff6a4d','#19b5a5','#f1d9a8','#8d7bd6','#cfd3da'][ri(5)]})}
const ci=ri(N),cj=ri(N),p=nodeP(ci,cj),civ=cars.filter(c=>!c.cop&&c.ai).length;
if(civ<26&&far(p[0],p[1],520,1000))mkCar(ci,cj);
const nc=cars.filter(c=>c.cop).length;if(stars()&&nc<stars()*2&&far(p[0],p[1],550,950)){const c=mkCar(ci,cj,1);c.m=0}
for(const c of cars){if(c===P.car||!c.ai&&!c.cop)continue;const d=D(c.x-t.x,c.y-t.y);if(d>1400||c.cop&&!stars()&&d>800)c.dead=1}
peds=peds.filter(p=>D(p.x-t.x,p.y-t.y)<1000)}
// ---- bucle de juego ----
function upd(dt){const kd=c=>k[c]?1:0,ax=kd('KeyD')+kd('ArrowRight')-kd('KeyA')-kd('ArrowLeft'),ay=kd('KeyS')+kd('ArrowDown')-kd('KeyW')-kd('ArrowUp');
if(G.dead>0){G.dead-=dt;if(G.dead<=0)respawn()}
else if(P.car){const c=P.car;carStep(c,dt,-ay,ax,k.Space);P.x=c.x;P.y=c.y;P.a=c.a}
else{const s=(k.ShiftLeft?170:105)*dt,l=D(ax,ay)||1,mx=ax/l*s,my=ay/l*s;if(!solid(P.x+mx,P.y,7,1))P.x+=mx;if(!solid(P.x,P.y+my,7,1))P.y+=my;
P.a=Math.atan2(mouse.y-VH/2,mouse.x-VW/2);P.fc-=dt;if((mouse.d||k.KeyF)&&P.fc<=0){P.fc=.14;shoot(P.x,P.y,P.a,1)}}
for(const c of cars){c.hit=0;c.ct-=dt;if(c===P.car&&!G.dead)continue;if(!c.ai&&!c.cop){carStep(c,dt,0,0,1);continue}c.cop?copAI(c,dt):civAI(c,dt)}
for(let i=0;i<cars.length;i++)for(let j=i+1;j<cars.length;j++){const a=cars[i],b=cars[j],dx=b.x-a.x,dy=b.y-a.y,d=D(dx,dy);
if(d<32&&d>0){const o=(32-d)/2,nx=dx/d,ny=dy/d;if(!solid(a.x-nx*o,a.y-ny*o,16)){a.x-=nx*o;a.y-=ny*o}if(!solid(b.x+nx*o,b.y+ny*o,16)){b.x+=nx*o;b.y+=ny*o}
const ra=D(Math.cos(a.a)*a.v-Math.cos(b.a)*b.v,Math.sin(a.a)*a.v-Math.sin(b.a)*b.v);
if(ra>130&&a.ct<=0&&b.ct<=0&&(a===P.car||b===P.car||a.cop||b.cop)){a.ct=b.ct=.3;hurt(a,ra*.05);hurt(b,ra*.05);snd(90,.1,'sawtooth',.07);if(a===P.car||b===P.car)G.heat+=.3}
a.v*=.97;b.v*=.97}}
for(const p of peds){p.t-=dt;p.f-=dt;if(p.t<=0){p.a=rnd(0,6.28);p.t=rnd(1,4);p.s=Math.random()<.25?0:rnd(25,45)}
for(const c of cars){const dx=p.x-c.x,dy=p.y-c.y,d=D(dx,dy);if(Math.abs(c.v)>90&&d<75){p.f=1.5;p.a=Math.atan2(dy,dx)}
if(d<20&&(c===P.car||c.cop)&&Math.abs(c.v)>70){killPed(p,c===P.car);break}}
const sp=(p.f>0?110:p.s)*dt,nx=p.x+Math.cos(p.a)*sp,ny=p.y+Math.sin(p.a)*sp;if(!solid(nx,ny,5,1)){p.x=nx;p.y=ny}else p.a+=2}
for(let i=bul.length-1;i>=0;i--){const b=bul[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.t-=dt;let x=b.t<=0||solid(b.x,b.y,1,1);
if(!x&&b.own){for(const p of peds)if(!p.dead&&D(p.x-b.x,p.y-b.y)<9){killPed(p,1);x=1;break}
if(!x)for(const c of cars)if(c!==P.car&&D(c.x-b.x,c.y-b.y)<20){hurt(c,c.cop?9:12);G.heat+=c.cop?.4:.15;x=1;break}}
else if(!x&&!b.own&&G.dead<=0){const t=P.car||P;if(D(t.x-b.x,t.y-b.y)<(P.car?20:9)){hurt(t,P.car?3:7);x=1}}
if(x)bul.splice(i,1)}
const t=P.car||P;
if(G.dead<=0&&!P.car&&stars()&&cars.some(c=>c.cop&&D(c.x-P.x,c.y-P.y)<36))die('DETENIDO');
G.heat=Math.max(0,G.heat-(cars.some(c=>c.cop&&D(c.x-t.x,c.y-t.y)<450)?.05:.25)*dt);
if(M){if(G.dead<=0&&D(P.x-M.x,P.y-M.y)<45){if(!M.s){let p;do{p=nodeP(ri(N),ri(N))}while(D(p[0]-M.x,p[1]-M.y)<700);M.t=D(p[0]-M.x,p[1]-M.y)/150+25;M.s=1;M.x=p[0];M.y=p[1];M.txt='Entrega el paquete';toast('Paquete recogido');snd(520,.15,'sine')}
else{const pay=300+(M.t|0)*5;G.money+=pay;toast('Entrega completa +$'+pay);snd(660,.25,'sine');M=null;G.mt=4}}
else if(M.s){M.t-=dt;if(M.t<=0){toast('Misión fallida');M=null;G.mt=4}}}
else if((G.mt-=dt)<=0)newM();
G.sp-=dt;if(G.sp<=0){G.sp=.3;spawn()}
cars=cars.filter(c=>!c.dead);peds=peds.filter(p=>!p.dead);
for(const f of fx)f.t-=dt;fx=fx.filter(f=>f.t>0)}
// ---- dibujo ----
function drawCar(c){ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.a);ctx.fillStyle='#0005';ctx.beginPath();ctx.roundRect(-18,-6,40,20,5);ctx.fill();
ctx.fillStyle=c.col;ctx.beginPath();ctx.roundRect(-20,-10,40,20,5);ctx.fill();
if(c.cop){ctx.fillStyle='#15171c';ctx.fillRect(-16,-10,9,20);ctx.fillRect(8,-10,8,20)}
ctx.fillStyle='#1a2030';ctx.fillRect(1,-8,9,16);ctx.fillRect(-13,-8,6,16);
ctx.fillStyle='#ffe9a8';ctx.fillRect(18,-8,3,4);ctx.fillRect(18,4,3,4);ctx.fillStyle='#c0392b';ctx.fillRect(-21,-8,2,4);ctx.fillRect(-21,4,2,4);
